# ---- Rate limiting (http context) --------------------------------------
# Per-IP limit for the dynamic backend only (static/media are exempt below).
# 10 r/s sustained + burst 20 is generous for humans, brutal for floods.
limit_req_zone $binary_remote_addr zone=perip:10m rate=10r/s;
limit_req_status 429;

# Common vulnerability-scanner probe paths -> block cheaply (444: close, no reply)
# NOTE: kept as a named location fragment via regex in each server block.

server {
    listen 80;
    server_name dananurzhumaevents.kz www.dananurzhumaevents.kz;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    # certbot ACME challenge — highest priority, must never be blocked
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # scanner probes -> drop before they reach Django/gunicorn
    location ~* (\.php|\.aspx?|\.jsp|/wp-|/xmlrpc|/\.env|/\.git|/\.svn|/cgi-bin|/vendor/|/phpmyadmin|/boaform|/luci|/SDK/|/\.aws) {
        return 444;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS сервер
server {
    listen 443 ssl http2;
    server_name dananurzhumaevents.kz www.dananurzhumaevents.kz;

    # SSL сертификаты
    ssl_certificate /etc/letsencrypt/live/dananurzhumaevents.kz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dananurzhumaevents.kz/privkey.pem;

    # SSL настройки
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Максимальный размер загружаемых файлов
    client_max_body_size 100M;

    # Логи
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    # scanner probes -> drop before they reach Django/gunicorn
    location ~* (\.php|\.aspx?|\.jsp|/wp-|/xmlrpc|/\.env|/\.git|/\.svn|/cgi-bin|/vendor/|/phpmyadmin|/boaform|/luci|/SDK/|/\.aws) {
        return 444;
    }

    # Статические файлы Django (no rate limit — cheap, served by nginx)
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Медиа файлы
    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Проксирование в Django (rate limited)
    location / {
        limit_req zone=perip burst=20 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
